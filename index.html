<!DOCTYPE html>

<style>
  * {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0000
  }
  
  body {
    height: 100vh;
    display: grid
  }
  
  canvas {
    grid-area: 1/1;
    height: min(100vh, 56.25vw);
    margin: auto
  }
  
  input {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 10.14vmin;
    color: #fff;
    background-color: #000c;
    border-radius: 2.49vmin;
    border: 1.26vmin solid #666;
    text-align: center;
    width: 62.49vmin;
    padding: 1.56vmin 3.12vmin;
    text-shadow: 
      -0.48vmin -0.48vmin 0 #999,
      0.48vmin -0.48vmin 0 #999,
      -0.48vmin 0.48vmin 0 #999,
      0.48vmin 0.48vmin 0 #999;
    font-family: system-ui, sans-serif;
    font-weight: 900
  }

</style>

<body oncontextmenu=return!1 ondragstart=return!1>
  <canvas id=c></canvas>
  <canvas id=u></canvas>
  <input type=text id=seed_input maxlength=8>
  <script src="index.js"></script>
</body>
